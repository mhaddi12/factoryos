services:
  postgres:
    image: postgres:18-alpine
    container_name: factoryos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: factoryos
      POSTGRES_PASSWORD: factoryos
      POSTGRES_DB: factoryos
    ports:
      - "5433:5432"
    volumes:
      - factoryos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factoryos -d factoryos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factoryos-postgres:
